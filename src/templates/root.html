<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AION 2 Guides</title>
<meta name="description" content="{{ t.home_desc }}">
{% if SITE.base_url %}<link rel="canonical" href="{{ SITE.base_url }}ru/ranger/">
<link rel="alternate" hreflang="en" href="{{ SITE.base_url }}en/ranger/">
<link rel="alternate" hreflang="ru" href="{{ SITE.base_url }}ru/ranger/">
<link rel="alternate" hreflang="x-default" href="{{ SITE.base_url }}ru/ranger/">{% endif %}
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>
  // Russian by default; keep a previously chosen language.
  (function () {
    var lang;
    try { lang = localStorage.getItem('lang'); } catch (e) {}
    if (lang !== 'en' && lang !== 'ru') {
      lang = 'ru';
    }
    location.replace(lang + '/ranger/' + location.search + location.hash);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#e8e4da;font-family:system-ui,sans-serif;}
  a{color:#d9b36c;margin:0 .6em;}
</style>
</head>
<body>
  <p><a href="en/ranger/">English</a> · <a href="ru/ranger/">Русский</a></p>
</body>
</html>
